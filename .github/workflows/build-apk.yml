name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create www Folder & Copy Files
        run: |
          mkdir -p www
          cp index.html style.css app.js www/ || true

      - name: Bulletproof Capacitor Setup
        run: |
          rm -f package.json capacitor.config.json
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ClothingApp" "com.clothing.app" --web-dir www

      - name: Add Android Project & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Clothing-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
